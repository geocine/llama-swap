healthCheckTimeout: 300
logRequests: true
logToStdout: both
startPort: 9000
apiKeys:
  - "${env.LS_KEY}"

macros:
  LLAMA_SERVER: /app/llama-server-progress
  SERVER_ARGS: >-
    -ngl 99 -np 1 -c 262144 -fa on
  KV_CACHE_Q4_ARGS: >-
    --cache-type-k q4_0 --cache-type-v q4_0
  KV_CACHE_Q8_ARGS: >-
    --cache-type-k q8_0 --cache-type-v q8_0
  DENSE_SAMPLING_ARGS: >-
    --top-k 20 --repeat_penalty 1.0
    --temp 0.6 --top-p 0.95 --min-p 0.00 --presence_penalty 0.0
  MOE_SAMPLING_ARGS: >-
    --temp 0.7 --top-p 0.8 --top-k 20
    --presence_penalty 1.5 --repeat_penalty 1.0
  # Optional grammar enforcement. The bundled think.gbnf forces a
  # "<think>GOAL/APPROACH/EDGE</think>" preamble before the answer.
  # Reference ${GRAMMAR_ARGS} from a model's cmd to opt in, or leave it
  # out to keep the model unconstrained.
  GRAMMAR_ARGS: >-
    --grammar-file /app/think.gbnf

models:
  qwen36-27b:
    cmd: >
      ${LLAMA_SERVER}
      -hf unsloth/Qwen3.6-27B-GGUF:Q4_K_M
      --port ${PORT}
      --alias ${MODEL_ID}
      ${SERVER_ARGS}
      ${KV_CACHE_Q4_ARGS}
      ${DENSE_SAMPLING_ARGS}

  qwen36-27b-uncensored:
    cmd: >
      ${LLAMA_SERVER}
      -hf HauhauCS/Qwen3.6-27B-Uncensored-HauhauCS-Aggressive:IQ4_XS
      --port ${PORT}
      --alias ${MODEL_ID}
      ${SERVER_ARGS}
      ${KV_CACHE_Q4_ARGS}
      ${DENSE_SAMPLING_ARGS}
  

