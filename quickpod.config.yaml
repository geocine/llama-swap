healthCheckTimeout: 300
logRequests: true
logToStdout: both
startPort: 9000
apiKeys:
  - "${env.LS_KEY}"

macros:
  LLAMA_SERVER: /app/llama-server-progress
  COMMON_ARGS: >-
    -ngl 99 -np 1 -c 262144 -fa on
    --cache-type-k q4_0 --cache-type-v q4_0
    --top-k 20 --repeat_penalty 1.0
  QWEN35_35B_A3B_COMMON_ARGS: >-
    -hf unsloth/Qwen3.5-35B-A3B-GGUF:UD-Q4_K_XL.gguf
    -ngl 999
    --fit off
    -fa on
    -ctk q4_0
    -ctv q4_0
    -b 2048
    -ub 512
    --parallel 1
    --no-mmap

