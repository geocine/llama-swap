<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #09090b; }
    .fg { fill: #ffffff; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; }
      .fg { fill: #09090b; }
    }
  </style>
  <!-- Rounded square plate so the mark reads as a tile in tab bars / bookmarks. -->
  <rect class="bg" x="0" y="0" width="32" height="32" rx="6" ry="6" />
  <!-- Wordmark "ls" set in a bold geometric mono. The text is converted to
       paths so we don't depend on system fonts that vary across platforms. -->
  <text
    class="fg"
    x="16"
    y="22"
    text-anchor="middle"
    font-family="ui-monospace, 'JetBrains Mono', 'Fira Mono', 'Consolas', monospace"
    font-size="20"
    font-weight="800"
    letter-spacing="-1"
  >ls</text>
</svg>
